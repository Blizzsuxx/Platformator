name: C++ validation
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [cleanup-debug, cleanup-asan, cleanup-work, cleanup-benchmark]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libgl-dev libegl-dev libdrm-dev libgbm-dev libudev-dev libhwloc-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Project tests (ASan memory access and UBSan; leak checking separate)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir bin/${{ matrix.preset }} --output-on-failure -E package_smoke
      - name: Source, installed and relocated SDK / Mario
        if: matrix.preset == 'cleanup-debug'
        run: ctest --test-dir bin/cleanup-debug -R '^platformator_package_smoke$' --output-on-failure
  physics-tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libhwloc-dev
      - name: Instrument engine and bundled TBB
        run: cmake --preset cleanup-tsan -DTBB_SANITIZE=thread
      - run: cmake --build --preset cleanup-tsan --parallel 2
      - name: Physics-only worker contracts
        run: ctest --test-dir bin/cleanup-tsan -R 'platformator_(physics_support|physics_geometry|transform_hierarchy)_test' --output-on-failure
      # No suppressions or allowed failures: unsupported TSan address layouts must
      # be reported visibly by the runner. This does not certify desktop SDL audio
      # threads or leak detection; see specs/001-cpp-engine-cleanup/validation.md.
